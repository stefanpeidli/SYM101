    #     table-row: oscars/movie
default-view: gene_results
webview-controls: true
views:
  gene_results:
    dataset: gene_results
    desc: |
      ### Gene-wise Results merged across Cell Lines.
      Bla.
    page-size: 50
    render-table:
      # add-columns:
      #   birth_season:
      #     value: |
      #       function getSeasonEmoji(row) {
      #           var month = row.birth_mo;
      #           const seasons = ["❄️", "🌸", "☀️", "🍁"];
      #           return (month < 1 || month > 12) ? "Invalid month" : seasons[Math.floor((month % 12) / 3)];
      #       }
      columns:
        index(0):
          label: "Gene"
        # Symmetric with 0 as center
        regex('.+_(lfc|LFC)'):
          plot:
            heatmap:
              type: quantitative
              scale: linear
              color-scheme: blueorange
              domain:
                - -5
                - 5
        # Anything between 0 and 1
        regex('.+_(FDR|fdr|p-value|pvalue)'):
          plot:
            heatmap:
              scale: linear
              color-scheme: blues
              domain:
                - 0
                - 1
        # Anything else (scores etc)
        regex('.+_(score|specificity)'):
          plot:
            heatmap:
              scale: linear
              color-scheme: oranges
              domain:
                - 0
                - 1
        # Anything else (BF etc)
        regex('.+_(Bayesfactor|BF)'):
          plot:
            heatmap:
              scale: linear
              color-scheme: oranges
              domain:
                - 500
                - 2000

