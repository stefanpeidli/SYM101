name: py_env

channels:
 - conda-forge
 - bioconda

dependencies:
 - conda-forge::python=3.11.5
 - conda-forge::tqdm
 - conda-forge::numpy
 - conda-forge::pandas
 - conda-forge::scipy
 - conda-forge::seaborn
 - conda-forge::matplotlib
 - conda-forge::nbformat=5.0.8  # >5.1 causes issues with jupyter ("id" tag)
 - conda-forge::jupyter
 - conda-forge::ipykernel
 - conda-forge::nbconvert
 - conda-forge::mscorefonts
  - pip:
    - PyComplexHeatmap==1.6.6